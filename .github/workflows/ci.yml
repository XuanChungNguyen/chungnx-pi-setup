name: Template checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
      - run: npm run check
      - run: npm test
      - run: npm run doctor
  runtime-resolution:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [minimal, coding, full]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix runtime/${{ matrix.profile }}
      - run: npm audit --omit=dev --audit-level=high --prefix runtime/${{ matrix.profile }}
      - run: git diff --exit-code -- runtime/${{ matrix.profile }}/package-lock.json
